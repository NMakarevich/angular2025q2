<mat-card class="card" [appColorizeByDate]="responseItem()?.snippet?.publishedAt!" [attribute]="'border'">
  <mat-card-header>
    <mat-card-title>{{responseItem()?.snippet?.title}}</mat-card-title>
  </mat-card-header>
  <img mat-card-image [src]="responseItem()?.snippet?.thumbnails?.default?.url!" alt="">
  <mat-card-content>
    <app-statistics [statistics]="responseItem()?.statistics"/>
  </mat-card-content>
  <mat-card-actions class="action">
    <app-button>More...</app-button>
  </mat-card-actions>
</mat-card>
